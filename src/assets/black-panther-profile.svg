<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Head -->
  <ellipse cx="100" cy="80" rx="45" ry="50" fill="#1a1a1a"/>
  
  <!-- Snout -->
  <ellipse cx="140" cy="85" rx="25" ry="28" fill="#1a1a1a"/>
  <ellipse cx="155" cy="85" rx="12" ry="15" fill="#2a2a2a"/>
  
  <!-- Nose -->
  <ellipse cx="163" cy="85" rx="5" ry="6" fill="#000"/>
  
  <!-- Mouth line -->
  <path d="M 163 85 Q 168 88 165 92" stroke="#333" stroke-width="1.5" fill="none"/>
  
  <!-- Ear -->
  <ellipse cx="70" cy="40" rx="12" ry="18" fill="#1a1a1a"/>
  <ellipse cx="70" cy="42" rx="6" ry="10" fill="#2a2a2a"/>
  
  <!-- Eye (bright green) -->
  <circle cx="120" cy="70" r="8" fill="#00ff00"/>
  <circle cx="120" cy="70" r="5" fill="#000"/>
  <circle cx="122" cy="68" r="2" fill="#fff"/>
  
  <!-- Neck -->
  <ellipse cx="100" cy="130" rx="35" ry="25" fill="#1a1a1a"/>
  
  <!-- Shoulder/Body -->
  <ellipse cx="70" cy="160" rx="40" ry="35" fill="#1a1a1a"/>
  
  <!-- Muzzle details -->
  <circle cx="155" cy="92" r="3" fill="#333" opacity="0.6"/>
  <circle cx="157" cy="78" r="2.5" fill="#333" opacity="0.5"/>
  
  <!-- Whiskers -->
  <line x1="145" y1="80" x2="175" y2="75" stroke="#333" stroke-width="1" opacity="0.7"/>
  <line x1="145" y1="90" x2="175" y2="95" stroke="#333" stroke-width="1" opacity="0.7"/>
  <line x1="148" y1="86" x2="178" y2="88" stroke="#333" stroke-width="1" opacity="0.7"/>
</svg>